
services:

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    
    env_file:
      - .env

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

    secrets:
      - db_password
      - db_root_password


  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always

    env_file:
      - .env

    depends_on:
      - mariadb

    volumes:
      - wordpress_data:/var/www/wordpress

    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
      - wp_user_password
      - wp_admin_password



  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always

    depends_on:
      - wordpress

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/wordpress

    networks:
      - inception




volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/mariadb
  
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/wordpress

networks:
  inception:
    driver: bridge



secrets:

  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt 